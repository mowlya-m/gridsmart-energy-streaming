# Local development stack for GridSmart.
#
#   docker compose up -d          bring up Kafka + Jupyter
#   docker compose logs -f kafka  watch broker startup
#   docker compose down -v        tear down, including volumes
#
# The Jupyter container mounts the repo, so edits to src/ are picked up by
# the notebooks without a rebuild.

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: gridsmart-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"   # in-network listener, used by Spark and the producer
      - "29092:29092" # host listener, for connecting from your laptop
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: containers reach the broker as kafka:9092, while
      # anything on the host reaches it as localhost:29092. Getting this
      # wrong is the usual cause of a producer that connects and then hangs.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-broker dev cluster, so replication must be 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # One hour of retention is plenty: Parquet is the durable record
      # (see docs/adr/0007-parquet-as-streaming-handoff.md).
      KAFKA_LOG_RETENTION_HOURS: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: gridsmart-jupyter
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8888:8888"  # JupyterLab
      - "4040:4040"  # Spark UI for the active session
    volumes:
      - .:/home/jovyan/work
    working_dir: /home/jovyan/work
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      GRIDSMART_DATA_DIR: /home/jovyan/work/data
      JUPYTER_ENABLE_LAB: "yes"
      # Pull the Kafka connector at session start. Version must track the
      # Spark version in this image exactly, or readStream fails with a
      # ClassNotFoundException on the Kafka source.
      PYSPARK_SUBMIT_ARGS: >-
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0
        pyspark-shell
    command: >
      bash -c "pip install --quiet -e . && start-notebook.sh --NotebookApp.token=''"
