name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.4.7 black==24.4.2
      - name: PEP 8 and import order
        run: ruff check src tests
      - name: Formatting
        run: black --check src tests

  test:
    name: Tests (PySpark ${{ matrix.spark }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spark: ["3.5.0", "3.5.5"]
    steps:
      - uses: actions/checkout@v4

      # Spark 3.5 targets Java 17. Letting the runner pick its own default
      # has broken the suite before when it moved to a newer JDK.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install pyspark==${{ matrix.spark }}
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests -q --cov=gridsmart --cov-report=term-missing

  notebooks:
    name: Notebooks are output-clean and valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install nbformat
      - name: Validate notebook JSON
        run: |
          python - <<'PY'
          import json, pathlib, sys, nbformat
          bad = []
          for path in pathlib.Path("notebooks").glob("*.ipynb"):
              try:
                  nbformat.validate(nbformat.read(path, as_version=4))
              except Exception as exc:
                  bad.append(f"{path}: {exc}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("All notebooks valid.")
          PY
