[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridsmart"
version = "1.0.0"
description = "Building energy forecasting for smart-grid operators: Spark ML batch training plus Kafka/Structured Streaming real-time inference."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mowlya Shree Manjunatha" }]
keywords = ["pyspark", "kafka", "structured-streaming", "mllib", "energy-forecasting"]

dependencies = [
    "pyspark>=3.5.0,<4.0",
    "kafka-python>=2.0.2",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "black>=24.1"]

[project.scripts]
gridsmart-producer = "gridsmart.producer:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# PEP 8 enforcement (E/W), pyflakes (F), import order (I), bugbear (B),
# and docstring presence (D): the code-quality feedback that motivated
# this refactor was specifically about PEP 8 and organisation.
select = ["E", "W", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D213", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]

[tool.black]
line-length = 110
target-version = ["py310"]
